name: Update README Stats

on:
  schedule:
    - cron: "23 3 * * *"   # daily, off-peak minute to avoid runner congestion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=Kaneki-Ken5454
            &show_icons=true
            &hide_border=true
            &hide=contribs,prs
            &include_all_commits=true
            &count_private=true
            &rank_icon=github
            &bg_color=0D0D0D,1A1A1A
            &title_color=C9A227
            &text_color=CFCFCF
            &icon_color=D4AF37
            &border_color=C9A227
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: false   # flip back to true once it works

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=Kaneki-Ken5454
            &layout=compact
            &langs_count=12
            &hide_border=true
            &count_private=true
            &bg_color=0D0D0D,1A1A1A
            &title_color=C9A227
            &text_color=CFCFCF
            &border_color=C9A227
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: false
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=Kaneki-Ken5454
            &layout=compact
            &langs_count=12
            &hide_border=true
            &count_private=true
            &bg_color=0D0D0D,1A1A1A
            &title_color=C9A227
            &text_color=CFCFCF
            &border_color=C9A227
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "chore: refresh profile stats cards" || exit 0
          git push
